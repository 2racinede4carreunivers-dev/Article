name: Pipeline HOL - Validation Methode Spectrale Savard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

# ==============================================================================
# JOB 1 - ATTESTATIONS SHA-256 POUR TOUS LES FICHIERS
# ==============================================================================
jobs:
  attestations:
    name: "Job 1 - Attestations SHA-256 (tous fichiers)"
    runs-on: ubuntu-latest

    steps:

      - name: "1.1 - Checkout du depot"
        uses: actions/checkout@v4

      - name: "1.2 - Attestation SHA-256 - Fichiers HOL (.thy)"
        run: |
          mkdir -p attestations/hol
          RAPPORT="attestations/hol/attestation_hol_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS HOL ISABELLE (.thy)"
            echo "  Projet   : Methode Spectrale - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Branche  : ${{ github.ref_name }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          for f in hol/*.thy; do
            if [ -f "$f" ]; then
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              LIGNES=$(wc -l < "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Lignes    : $LIGNES"
                echo "  Date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "  Depot     : ${{ github.repository }}"
                echo "  Commit    : ${{ github.sha }}"
                echo "  Run ID    : ${{ github.run_id }}"
                echo "  Run URL   : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            fi
          done
          cat "$RAPPORT"

      - name: "1.3 - Attestation SHA-256 - Fichiers Python (.py)"
        run: |
          mkdir -p attestations/py
          RAPPORT="attestations/py/attestation_python_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS PYTHON (.py)"
            echo "  Projet   : Pipeline HOL - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls py/*.py 1>/dev/null 2>&1; then
            for f in py/*.py; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              LIGNES=$(wc -l < "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Lignes    : $LIGNES"
                echo "  Date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .py dans py/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.4 - Attestation SHA-256 - Fichiers LaTeX (.tex)"
        run: |
          mkdir -p attestations/tex
          RAPPORT="attestations/tex/attestation_latex_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS LaTeX (.tex)"
            echo "  Projet   : Article - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls tex/*.tex 1>/dev/null 2>&1; then
            for f in tex/*.tex; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              LIGNES=$(wc -l < "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Lignes    : $LIGNES"
                echo "  Date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .tex dans tex/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.5 - Attestation SHA-256 - Fichiers JSON (.json)"
        run: |
          mkdir -p attestations/json
          RAPPORT="attestations/json/attestation_json_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS JSON (.json)"
            echo "  Projet   : Corpus HOL - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls json/*.json 1>/dev/null 2>&1; then
            for f in json/*.json; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .json dans json/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.6 - Attestation SHA-256 - Base de donnees SQLite (.db)"
        run: |
          mkdir -p attestations/corpus
          RAPPORT="attestations/corpus/attestation_db_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - BASE DE DONNEES SQLite (.db)"
            echo "  Projet   : Corpus HOL - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls corpus/*.db 1>/dev/null 2>&1; then
            for f in corpus/*.db; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .db dans corpus/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.7 - Rapport SHA-256 global consolide"
        run: |
          RAPPORT="attestations/rapport_sha256_global.txt"
          {
            echo "========================================================"
            echo "  RAPPORT SHA-256 GLOBAL CONSOLIDE"
            echo "  Projet    : La Geometrie du Spectre des Nombres Premiers"
            echo "  Auteur    : Philippe Thomas Savard"
            echo "  Depot     : ${{ github.repository }}"
            echo "  Commit    : ${{ github.sha }}"
            echo "  Branche   : ${{ github.ref_name }}"
            echo "  Date UTC  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID    : ${{ github.run_id }}"
            echo "  Run URL   : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "========================================================"
            echo ""
            echo "--- HOL Isabelle (.thy) ---"
          } > "$RAPPORT"
          { sha256sum hol/*.thy 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- Python (.py) ---"; } >> "$RAPPORT"
          { sha256sum py/*.py 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- LaTeX (.tex) ---"; } >> "$RAPPORT"
          { sha256sum tex/*.tex 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- JSON (.json) ---"; } >> "$RAPPORT"
          { sha256sum json/*.json 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- Base de donnees SQLite (.db) ---"; } >> "$RAPPORT"
          { sha256sum corpus/*.db 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "========================================================"; } >> "$RAPPORT"
          cat "$RAPPORT"

      - name: "1.8 - Attestation GitHub SLSA - methode_spectral.thy"
        if: hashFiles('hol/methode_spectral.thy') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hol/methode_spectral.thy

      - name: "1.9 - Attestation GitHub SLSA - rapport_architecture.thy"
        if: hashFiles('hol/rapport_architecture.thy') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hol/rapport_architecture.thy

      - name: "1.10 - Upload artefact - Toutes les attestations SHA-256"
        uses: actions/upload-artifact@v4
        with:
          name: attestations-sha256
          path: attestations/
          retention-days: 90

# ==============================================================================
# JOB 2 - COMPILATION ISABELLE/HOL  (multi-miroirs - script Gabriel)
# 3 miroirs : Cambridge -> SourceForge -> TUM
# Sanity-check taille > 100 Mo avant extraction
# ==============================================================================
  isabelle-build:
    name: "Job 2 - Compilation Isabelle/HOL (multi-miroirs)"
    runs-on: ubuntu-latest
    needs: attestations

    steps:

      - name: "2.1 - Checkout du depot"
        uses: actions/checkout@v4

      - name: Install Isabelle 2025-2 (multi-miroirs)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget tar bzip2 libgmp-dev perl
          mkdir -p /tmp/isabelle
          cd /tmp/isabelle

          ARCHIVE="Isabelle2025-2_linux.tar.gz"
          MIRRORS=(
            "https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/${ARCHIVE}"
            "https://downloads.sourceforge.net/projects/isabelle/files/Isabelle2025-2/${ARCHIVE}/download"
            "https://isabelle.in.tum.de/website-Isabelle2025-2/dist/${ARCHIVE}"
          )

          success=0
          for url in "${MIRRORS[@]}"; do
            echo "::group::Tentative de telechargement : ${url}"
            if wget --tries=3 --timeout=60 -O isabelle.tar.gz "${url}"; then
              size=$(stat -c%s isabelle.tar.gz)
              if [ "${size}" -gt 100000000 ]; then
                echo "Telechargement OK (${size} octets)"
                success=1
                echo "::endgroup::"
                break
              else
                echo "Archive trop petite (${size} octets), tentative suivante."
              fi
            fi
            echo "::endgroup::"
          done

          if [ "${success}" -ne 1 ]; then
            echo "::error::Aucun miroir Isabelle n'a repondu. Verifier la disponibilite reseau."
            exit 8
          fi

          tar -xzf isabelle.tar.gz
          ls -1
          echo "/tmp/isabelle/Isabelle2025-2/bin" >> "$GITHUB_PATH"
          /tmp/isabelle/Isabelle2025-2/bin/isabelle version

      - name: Show repository layout
        run: |
          pwd
          ls -la
          find . -maxdepth 3 \( -name ROOT -o -name 'methode_spectral.thy' \) | sort

      - name: "2.4 - Creation du fichier ROOT (session Isabelle)"
        run: |
          {
            echo 'session Methode_Spectrale = HOL +'
            echo '  description "Methode Spectrale - Philippe Thomas Savard"'
            echo '  options [timeout = 7200, document = false]'
            echo '  sessions'
            echo '    "HOL-Computational_Algebra"'
            echo '    Complex_Main'
            echo '  theories'
            echo '    methode_spectral'
          } > hol/ROOT
          if [ -f "hol/rapport_architecture.thy" ]; then
            echo '    rapport_architecture' >> hol/ROOT
          fi
          echo "Fichier ROOT cree :"
          cat hol/ROOT

      - name: Build Isabelle session (methode_spectral)
        working-directory: hol
        run: |
          isabelle build -v -D .

      - name: Create explicit attestation payload
        if: success()
        run: |
          cat > attestation_payload.json <<'EOF'
          {
            "schemaVersion": 1,
            "subject": "hol/methode_spectral.thy",
            "author": "Philippe Thomas Savard",
            "coAuthors": [
              "Emergent.sh E1",
              "Gordon Docker Desktop",
              "Copilot Microsoft"
            ],
            "statement": "These assistants contributed remarkably and their contribution is invaluable for Philippe Thomas Savard."
          }
          EOF

      - name: Generate build provenance attestation
        if: success()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hol/methode_spectral.thy

      - name: Upload attestation payload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: methode-spectral-attestation-payload
          path: |
            attestation_payload.json
            hol/methode_spectral.thy
          retention-days: 30

# ==============================================================================
# JOB 3 - COMPILATION LaTeX  (EXPRESS - packages minimaux)
# texlive-full    : ~4 GB, 20-30 min
# Express (ce job):  ~400 MB, 2-4 min
# ==============================================================================
  latex-build:
    name: "Job 3 - Compilation LaTeX (express - packages minimaux)"
    runs-on: ubuntu-latest
    needs: attestations

    steps:

      - name: "3.1 - Checkout du depot"
        uses: actions/checkout@v4

      - name: "3.2 - Installation LaTeX EXPRESS (packages minimaux)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-french \
            texlive-science \
            texlive-bibtex-extra \
            latexmk \
            cm-super \
            lmodern
          echo "Installation LaTeX express terminee."
          latexmk --version

      - name: "3.3 - SHA-256 du fichier source .tex"
        run: |
          mkdir -p build-latex
          { sha256sum tex/*.tex 2>/dev/null || echo "  (aucun .tex)"; } \
            | tee build-latex/sha256_tex_source.txt

      - name: "3.4 - Compilation LaTeX - Geometrie_du_Spectre"
        run: |
          mkdir -p build-latex
          if ls tex/*.tex 1>/dev/null 2>&1; then
            cd tex
            set +e
            latexmk -pdf \
              -interaction=nonstopmode \
              Geometrie_du_Spectre_des_Nombres_Premiers_2026.tex \
              2>&1 | tee ../build-latex/latex_build_log.txt
            set -e
            if ls *.pdf 1>/dev/null 2>&1; then
              cp *.pdf ../build-latex/
              echo "LATEX_STATUS=SUCCESS" >> $GITHUB_ENV
            else
              echo "LATEX_STATUS=FAILED" >> $GITHUB_ENV
            fi
          else
            echo "LATEX_STATUS=NO_TEX_FILE" >> $GITHUB_ENV
            echo "  (aucun fichier .tex trouve dans tex/)" \
              > build-latex/latex_build_log.txt
          fi

      - name: "3.5 - Rapport de compilation LaTeX"
        run: |
          RAPPORT="build-latex/rapport_compilation_latex.txt"
          echo "========================================================"  > "$RAPPORT"
          echo "  RAPPORT DE COMPILATION LaTeX"                           >> "$RAPPORT"
          echo "  Projet    : Methode Spectrale - Philippe Thomas Savard" >> "$RAPPORT"
          echo "  Depot     : ${{ github.repository }}"                   >> "$RAPPORT"
          echo "  Commit    : ${{ github.sha }}"                          >> "$RAPPORT"
          echo "  Date UTC  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"        >> "$RAPPORT"
          echo "  Run ID    : ${{ github.run_id }}"                       >> "$RAPPORT"
          echo "  Mode      : EXPRESS (packages minimaux)"                >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "--- STATUT ---"                                            >> "$RAPPORT"
          echo "  Compilation LaTeX : $LATEX_STATUS"                      >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "--- Fichier source .tex ---"                               >> "$RAPPORT"
          { ls -lh tex/*.tex 2>/dev/null || echo "  (aucun)"; }           >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "--- SHA-256 source .tex ---"                              >> "$RAPPORT"
          { sha256sum tex/*.tex 2>/dev/null || echo "  (aucun)"; }        >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "--- PDF genere ---"                                        >> "$RAPPORT"
          { ls -lh build-latex/*.pdf 2>/dev/null || echo "  (aucun)"; }  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "--- SHA-256 PDF genere ---"                               >> "$RAPPORT"
          { sha256sum build-latex/*.pdf 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "--- LOG COMPLET LaTeX ---"                                >> "$RAPPORT"
          cat build-latex/latex_build_log.txt                             >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          cat "$RAPPORT"

      - name: "3.6 - Attestation GitHub SLSA - rapport LaTeX"
        if: hashFiles('build-latex/rapport_compilation_latex.txt') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build-latex/rapport_compilation_latex.txt

      - name: "3.7 - Upload artefact - PDF compile et rapport LaTeX"
        uses: actions/upload-artifact@v4
        with:
          name: rapport-compilation-latex
          path: build-latex/
          retention-days: 90

# ==============================================================================
# JOB 4 - RAPPORT FINAL D'INTEGRITE GLOBALE
# ==============================================================================
  rapport-final:
    name: "Job 4 - Rapport final integrite globale"
    runs-on: ubuntu-latest
    needs: [attestations, isabelle-build, latex-build]
    if: always()

    steps:

      - name: "4.1 - Checkout du depot"
        uses: actions/checkout@v4

      - name: "4.2 - Telechargement de tous les artefacts"
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: "4.3 - Generation du rapport final integrite"
        run: |
          mkdir -p rapport-final
          RAPPORT="rapport-final/rapport_integrite_global.txt"
          echo "========================================================"  > "$RAPPORT"
          echo "  RAPPORT FINAL D'INTEGRITE - PIPELINE SAVARD 2026"       >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "  Projet    : La Geometrie du Spectre des Nombres Premiers" >> "$RAPPORT"
          echo "  Auteur    : Philippe Thomas Savard"                      >> "$RAPPORT"
          echo "  Site web  : www.universestaucarre.com"                   >> "$RAPPORT"
          echo "  Depot     : ${{ github.repository }}"                   >> "$RAPPORT"
          echo "  Commit    : ${{ github.sha }}"                          >> "$RAPPORT"
          echo "  Branche   : ${{ github.ref_name }}"                     >> "$RAPPORT"
          echo "  Date UTC  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"        >> "$RAPPORT"
          echo "  Run ID    : ${{ github.run_id }}"                       >> "$RAPPORT"
          echo "  Run URL   : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo "  SECTION 1 - STATUT DES JOBS"                            >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "  Job 1 - Attestations SHA-256 : ${{ needs.attestations.result }}"    >> "$RAPPORT"
          echo "  Job 2 - Compilation HOL      : ${{ needs.isabelle-build.result }}"  >> "$RAPPORT"
          echo "  Job 3 - Compilation LaTeX    : ${{ needs.latex-build.result }}"     >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo "  SECTION 2 - SHA-256 GLOBAL DE TOUS LES FICHIERS"        >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "--- HOL Isabelle (.thy) ---"                              >> "$RAPPORT"
          { sha256sum hol/*.thy 2>/dev/null || echo "  (aucun)"; }        >> "$RAPPORT"
          { echo ""; echo "--- Python (.py) ---"; }                       >> "$RAPPORT"
          { sha256sum py/*.py 2>/dev/null || echo "  (aucun)"; }          >> "$RAPPORT"
          { echo ""; echo "--- LaTeX (.tex) ---"; }                       >> "$RAPPORT"
          { sha256sum tex/*.tex 2>/dev/null || echo "  (aucun)"; }        >> "$RAPPORT"
          { echo ""; echo "--- JSON (.json) ---"; }                       >> "$RAPPORT"
          { sha256sum json/*.json 2>/dev/null || echo "  (aucun)"; }      >> "$RAPPORT"
          { echo ""; echo "--- Base SQLite (.db) ---"; }                  >> "$RAPPORT"
          { sha256sum corpus/*.db 2>/dev/null || echo "  (aucun)"; }      >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo "  SECTION 3 - ARTEFACTS PRODUITS PAR CE WORKFLOW"         >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          { ls -lhR all-artifacts/ 2>/dev/null || echo "  (aucun artefact)"; } >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo "  SECTION 4 - ARCHITECTURE LOGIQUE (Regle Savard)"        >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "  ENSEMBLE = 1"                                            >> "$RAPPORT"
          echo "    = 1/x  (Zeta Riemann)  = 1/y1 + 1/y2 + 1/y3"         >> "$RAPPORT"
          echo "    + 1/t  (psi_savard)"                                  >> "$RAPPORT"
          echo "    + 1/ms (Methode Spectrale) = 1/ms1 + 1/ms2 + 1/ms3"  >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "  Concordances :"                                          >> "$RAPPORT"
          echo "    C1 : 1/y1 <-> 1/t    Tchebychev = psi_savard"        >> "$RAPPORT"
          echo "    C2 : 1/y3 <-> 1/ms1  Zeros non-triviaux = positions P" >> "$RAPPORT"
          echo "    C3 : 1/y2 <-> 1/ms3  Re(rho) = 1/2 = RsP = 1/2"     >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "  Theoreme central : synthese_pont_savard"                >> "$RAPPORT"
          echo "    Pour tout n1>=1, n2>=1, n1!=n2 :"                    >> "$RAPPORT"
          echo "    Re_droite_critique(n1,n2) = RsP(n1,n2) = 1/2"        >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "  Total objets formels HOL : 553"                         >> "$RAPPORT"
          echo "  Sections logiques        : 10"                          >> "$RAPPORT"
          echo "  Concordances             : 3 (C1, C2, C3)"              >> "$RAPPORT"
          echo ""                                                          >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          echo "  FIN DU RAPPORT FINAL D'INTEGRITE"                       >> "$RAPPORT"
          echo "========================================================"  >> "$RAPPORT"
          cat "$RAPPORT"

      - name: "4.4 - Attestation GitHub SLSA - rapport final"
        if: hashFiles('rapport-final/rapport_integrite_global.txt') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: rapport-final/rapport_integrite_global.txt

      - name: "4.5 - Upload artefact - Rapport final integrite"
        uses: actions/upload-artifact@v4
        with:
          name: rapport-integrite-global
          path: rapport-final/
          retention-days: 90
