name: Pipeline HOL - Validation Methode Spectrale Savard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

# ==============================================================================
# JOB 1 - ATTESTATIONS SHA-256 POUR TOUS LES FICHIERS
# ==============================================================================
jobs:
  attestations:
    name: "Job 1 - Attestations SHA-256 (tous fichiers)"
    runs-on: ubuntu-latest

    steps:

      - name: "1.1 - Checkout du depot"
        uses: actions/checkout@v4

      - name: "1.2 - Attestation SHA-256 - Fichiers HOL (.thy)"
        run: |
          mkdir -p attestations/hol
          RAPPORT="attestations/hol/attestation_hol_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS HOL ISABELLE (.thy)"
            echo "  Projet   : Methode Spectrale - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Branche  : ${{ github.ref_name }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          for f in hol/*.thy; do
            if [ -f "$f" ]; then
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              LIGNES=$(wc -l < "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Lignes    : $LIGNES"
                echo "  Date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "  Depot     : ${{ github.repository }}"
                echo "  Commit    : ${{ github.sha }}"
                echo "  Run ID    : ${{ github.run_id }}"
                echo "  Run URL   : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            fi
          done
          cat "$RAPPORT"

      - name: "1.3 - Attestation SHA-256 - Fichiers Python (.py)"
        run: |
          mkdir -p attestations/py
          RAPPORT="attestations/py/attestation_python_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS PYTHON (.py)"
            echo "  Projet   : Pipeline HOL - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls py/*.py 1>/dev/null 2>&1; then
            for f in py/*.py; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              LIGNES=$(wc -l < "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Lignes    : $LIGNES"
                echo "  Date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .py dans py/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.4 - Attestation SHA-256 - Fichiers LaTeX (.tex)"
        run: |
          mkdir -p attestations/tex
          RAPPORT="attestations/tex/attestation_latex_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS LaTeX (.tex)"
            echo "  Projet   : Article - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls tex/*.tex 1>/dev/null 2>&1; then
            for f in tex/*.tex; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              LIGNES=$(wc -l < "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Lignes    : $LIGNES"
                echo "  Date      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .tex dans tex/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.5 - Attestation SHA-256 - Fichiers JSON (.json)"
        run: |
          mkdir -p attestations/json
          RAPPORT="attestations/json/attestation_json_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - FICHIERS JSON (.json)"
            echo "  Projet   : Corpus HOL - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls json/*.json 1>/dev/null 2>&1; then
            for f in json/*.json; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .json dans json/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.6 - Attestation SHA-256 - Base de donnees SQLite (.db)"
        run: |
          mkdir -p attestations/corpus
          RAPPORT="attestations/corpus/attestation_db_detaillee.txt"
          {
            echo "========================================================"
            echo "  ATTESTATION SHA-256 - BASE DE DONNEES SQLite (.db)"
            echo "  Projet   : Corpus HOL - Philippe Thomas Savard"
            echo "  Depot    : ${{ github.repository }}"
            echo "  Commit   : ${{ github.sha }}"
            echo "  Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID   : ${{ github.run_id }}"
            echo "========================================================"
            echo ""
          } >> "$RAPPORT"
          if ls corpus/*.db 1>/dev/null 2>&1; then
            for f in corpus/*.db; do
              NOM=$(basename "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TAILLE=$(stat -c%s "$f")
              {
                echo "----------------------------------------------------"
                echo "  Fichier   : $NOM"
                echo "  Chemin    : $f"
                echo "  SHA-256   : $SHA"
                echo "  Taille    : $TAILLE octets"
                echo "  Commit    : ${{ github.sha }}"
                echo "----------------------------------------------------"
                echo ""
              } >> "$RAPPORT"
            done
          else
            echo "  (aucun fichier .db dans corpus/)" >> "$RAPPORT"
          fi
          cat "$RAPPORT"

      - name: "1.7 - Rapport SHA-256 global consolide"
        run: |
          RAPPORT="attestations/rapport_sha256_global.txt"
          {
            echo "========================================================"
            echo "  RAPPORT SHA-256 GLOBAL CONSOLIDE"
            echo "  Projet    : La Geometrie du Spectre des Nombres Premiers"
            echo "  Auteur    : Philippe Thomas Savard"
            echo "  Depot     : ${{ github.repository }}"
            echo "  Commit    : ${{ github.sha }}"
            echo "  Branche   : ${{ github.ref_name }}"
            echo "  Date UTC  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID    : ${{ github.run_id }}"
            echo "  Run URL   : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "========================================================"
            echo ""
            echo "--- HOL Isabelle (.thy) ---"
          } > "$RAPPORT"
          { sha256sum hol/*.thy 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- Python (.py) ---"; } >> "$RAPPORT"
          { sha256sum py/*.py 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- LaTeX (.tex) ---"; } >> "$RAPPORT"
          { sha256sum tex/*.tex 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- JSON (.json) ---"; } >> "$RAPPORT"
          { sha256sum json/*.json 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "--- Base de donnees SQLite (.db) ---"; } >> "$RAPPORT"
          { sha256sum corpus/*.db 2>/dev/null || echo "  (aucun)"; } >> "$RAPPORT"
          { echo ""; echo "========================================================"; } >> "$RAPPORT"
          cat "$RAPPORT"

      - name: "1.8 - Attestation GitHub SLSA - methode_spectral.thy"
        if: hashFiles('hol/methode_spectral.thy') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hol/methode_spectral.thy

      - name: "1.9 - Attestation GitHub SLSA - rapport_architecture.thy"
        if: hashFiles('hol/rapport_architecture.thy') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hol/rapport_architecture.thy

      - name: "1.10 - Upload artefact - Toutes les attestations SHA-256"
        uses: actions/upload-artifact@v4
        with:
          name: attestations-sha256
          path: attestations/
          retention-days: 90

# ==============================================================================
# JOB 2 - COMPILATION ISABELLE/HOL  (EXPRESS + DOUBLE CACHE)
# 1er lancement : ~12-15 min  (telechargement + compilation)
# Runs suivants  :  ~3-5 min  (cache Isabelle + cache heap HOL)
# ==============================================================================
  isabelle-build:
    name: "Job 2 - Compilation Isabelle/HOL (express + cache)"
    runs-on: ubuntu-latest
    needs: attestations

    steps:

      - name: "2.1 - Checkout du depot"
        uses: actions/checkout@v4

      - name: "2.2 - Installation Java 17 (JRE leger uniquement)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jre-headless \
            wget \
            tar
          java -version

      - name: "2.3 - Cache Isabelle 2024 (archive telechargee une seule fois)"
        id: cache-isabelle
        uses: actions/cache@v4
        with:
          path: ~/isabelle-dist/Isabelle2024
          key: isabelle-2024-linux-v1

      - name: "2.4 - Telechargement Isabelle 2024 (si cache absent)"
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/isabelle-dist
          cd ~/isabelle-dist
          echo "Cache absent - telechargement en cours..."
          wget -q --show-progress \
            https://isabelle.in.tum.de/dist/Isabelle2024_linux.tar.gz
          tar xzf Isabelle2024_linux.tar.gz
          rm Isabelle2024_linux.tar.gz
          echo "Telechargement et extraction termines."

      - name: "2.5 - Ajout Isabelle au PATH"
        run: |
          echo "$HOME/isabelle-dist/Isabelle2024/bin" >> $GITHUB_PATH
          ~/isabelle-dist/Isabelle2024/bin/isabelle version

      - name: "2.6 - Creation du fichier ROOT (session Isabelle)"
        run: |
          {
            echo 'session Methode_Spectrale = HOL +'
            echo '  description "Methode Spectrale - Philippe Thomas Savard"'
            echo '  options [timeout = 7200, document = false]'
            echo '  sessions'
            echo '    "HOL-Computational_Algebra"'
            echo '    Complex_Main'
            echo '  theories'
            echo '    methode_spectral'
          } > hol/ROOT
          if [ -f "hol/rapport_architecture.thy" ]; then
            echo '    rapport_architecture' >> hol/ROOT
          fi
          echo "Fichier ROOT cree :"
          cat hol/ROOT

      - name: "2.7 - Cache session HOL compilee (cle = hash des .thy)"
        id: cache-hol-session
        uses: actions/cache@v4
        with:
          path: ~/.isabelle/Isabelle2024/heaps
          key: hol-methode-spectrale-${{ hashFiles('hol/*.thy') }}
          restore-keys: |
            hol-methode-spectrale-

      - name: "2.8 - Compilation de la session HOL Methode_Spectrale"
        run: |
          mkdir -p build-reports
          set +e
          isabelle build -D hol -b Methode_Spectrale -v \
            2>&1 | tee build-reports/isabelle_build_log.txt
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "HOL_STATUS=SUCCESS" >> $GITHUB_ENV
          else
            echo "HOL_STATUS=FAILED_code_$CODE" >> $GITHUB_ENV
          fi

      - name: "2.9 - Rapport de compilation HOL detaille"
        run: |
          RAPPORT="build-reports/rapport_compilation_hol.txt"
          {
            echo "========================================================"
            echo "  RAPPORT DE COMPILATION HOL ISABELLE"
            echo "  Projet    : Methode Spectrale - Philippe Thomas Savard"
            echo "  Depot     : ${{ github.repository }}"
            echo "  Commit    : ${{ github.sha }}"
            echo "  Date UTC  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Run ID    : ${{ github.run_id }}"
            echo "  Cache Isabelle : ${{ steps.cache-isabelle.outputs.cache-hit == 'true' && 'HIT (express)' || 'MISS (telechargement)' }}"
            echo "  Cache HOL heap : ${{ steps.cache-hol-session.outputs.cache-hit == 'true' && 'HIT (express)' || 'MISS (compilation)' }}"
            echo "========================================================"
            echo ""
            echo "--- STATUT GLOBAL ---"
            echo "  Compilation HOL : $HOL_STATUS"
            echo ""
            echo "--- Fichiers HOL ---"
          } > "$RAPPORT"
          ls -lh hol/*.thy >> "$RAPPORT"
          { echo ""; echo "--- SHA-256 des fichiers HOL ---"; } >> "$RAPPORT"
          sha256sum hol/*.thy >> "$RAPPORT"
          { echo ""; echo "--- Session ROOT ---"; } >> "$RAPPORT"
          cat hol/ROOT >> "$RAPPORT"
          { echo ""; echo "--- LOG COMPLET DE COMPILATION ---"; } >> "$RAPPORT"
          cat build-reports/isabelle_build_log.txt >> "$RAPPORT"
          echo "========================================================" >> "$RAPPORT"
          cat "$RAPPORT"

      - name: "2.10 - Attestation GitHub SLSA - rapport compilation HOL"
        if: hashFiles('build-reports/rapport_compilation_hol.txt') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build-reports/rapport_compilation_hol.txt

      - name: "2.11 - Upload artefact - Rapport compilation HOL"
        uses: actions/upload-artifact@v4
        with:
          name: rapport-compilation-hol
          path: build-reports/
          retention-days: 90

# ==============================================================================
# JOB 3 - COMPILATION LaTeX  (EXPRESS - packages minimaux)
# texlive-full    : ~4 GB, 20-30 min
# Express (ce job):  ~400 MB, 2-4 min
# ==============================================================================
  latex-build:
    name: "Job 3 - Compilation LaTeX (express - packages minimaux)"
    runs-on: ubuntu-latest
    needs: attestations

    steps:

      - name: "3.1 - Checkout du depot"
        uses: actions/checkout@v4

      - name: "3.2 - Installation LaTeX EXPRESS (packages minimaux)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-french \
            texlive-science \
            texlive-bibtex-extra \
            latexmk \
            cm-super
          echo "Installation LaTeX express terminee."
          latexmk --version

      - name: "3.3 - SHA-256 du fichier source .tex"
        run: |
          mkdir -p build-latex
          { sha256sum tex/*.tex 2>/dev/null || echo "  (aucun .tex)"; } \
            | tee build-latex/sha256_tex_source.txt

      - name: "3.4 - Compilation LaTeX - Geometrie_du_Spectre"
        run: |
          mkdir -p build-latex
          if ls tex/*.tex 1>/dev/null 2>&1; then
            cd tex
            set +e
            latexmk -pdf \
              -interaction=nonstopmode \
              Geometrie_du_Spectre_des_Nombres_Premiers_2026.tex \
              2>&1 | tee ../build-latex/latex_build_log.txt
            set -e
            if ls *.pdf 1>/dev/null 2>&1; then
              cp *.pdf ../build-latex/
              echo "LATEX_STATUS=SUCCESS" >> $GITHUB_ENV
            else
              echo "LATEX_STATUS=FAILED" >> $GITHUB_ENV
            fi
          else
            echo "LATEX_STATUS=NO_TEX_FILE" >> $GITHUB_ENV
            echo "  (aucun fichier .tex trouve dans tex/)" \
              > build-latex/latex_build_log.txt
          fi

      - name: "3.5 - Rapport de compilation LaTeX"
        run: |
          RAPPORT="build-latex/rapport_compilation_latex.txt"
          {
            echo "========================================================"
            echo "  RAPPORT DE COMPILATION LaTeX"
            echo "  Projet    : Methode Spectrale - Philippe Thomas Savard"
            echo "  Depot     : ${{ github.repository }}"
            echo "  Commit    